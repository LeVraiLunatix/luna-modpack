# Construit tous les paquets LUNA (chaque version de Minecraft × full / lite + serveur) et les publie
# dans une release GitHub quand un tag v* est poussé :  git tag v1.3.0 && git push origin v1.3.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache des jars Modrinth
        uses: actions/cache@v4
        with:
          path: .cache
          key: modrinth-${{ hashFiles('pack.config.json') }}
          restore-keys: modrinth-
      - name: Build
        run: node build.mjs
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "LUNA ${GITHUB_REF_NAME#v}" \
            --notes-file "modrinth/changelog-${GITHUB_REF_NAME#v}.md"
